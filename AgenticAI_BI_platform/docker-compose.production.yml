services:
  agentic-ai-bi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    container_name: agentic-ai-bi-platform
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # AI API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      
      # N8N Configuration
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_BASE_URL=${N8N_BASE_URL}
      
      # Optional: Affine Integration
      - AFFINE_API_KEY=${AFFINE_API_KEY:-}
      - AFFINE_WORKSPACE_ID=${AFFINE_WORKSPACE_ID:-}
      
      # Optional: Pinecone
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      
      # Application Settings
      - HOST=0.0.0.0
      - PORT=5001
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/upload/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agentic-network

networks:
  agentic-network:
    driver: bridge

# Volume for persistent data (optional)
volumes:
  uploads:
    driver: local

