# Production Docker Compose
# Usage: docker-compose -f docker-compose.prod.yml up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic-bi-backend-prod
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_API_URL=${N8N_API_URL:-https://n8n.casamccartney.link}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - REDIS_URL=${REDIS_URL}
      - DATAHUB_API_URL=${DATAHUB_API_URL}
      - DATAHUB_API_TOKEN=${DATAHUB_API_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=False
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    volumes:
      - backend-uploads:/app/uploads
      - backend-static:/app/static
    restart: unless-stopped
    networks:
      - app-network
    command: uvicorn app:app --host 0.0.0.0 --port 5000 --workers 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/upload/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: agentic-bi-frontend-prod
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://backend:5000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

volumes:
  backend-uploads:
  backend-static:

networks:
  app-network:
    driver: bridge

